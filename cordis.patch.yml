# dsh-jev bundle layer. A profile applies this file when it lists the
# bundle, because package.json points `dsh.bundle.patch` at it.
#
# `name` is a module specifier. This file uses the package name `dsh-jev`,
# which resolves to this package's dist/index.js. A bare value resolves as a
# package name from the profile's node_modules or
# `$DSH_HOME/profiles/node_modules`. A value that is absolute or starts with
# `./` or `../` is anchored beside this file instead.
- insert:
    - id: jev
      name: dsh-jev
